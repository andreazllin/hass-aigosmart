name: Release

# Versioning is manual (see "Release Process" in CLAUDE.md): the release
# commit `chore(release): vX.Y.Z` and the `vX.Y.Z` tag are created locally,
# then pushed. This workflow reacts to the tag push: it builds the HACS zip
# and publishes the GitHub Release with auto-generated notes (commit list +
# full-changelog diff since the previous release).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/aigostar/manifest.json'))['version'])")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${MANIFEST_VERSION} — retag after bumping the manifest"
            exit 1
          fi

      - name: Build integration archive
        id: build
        run: |
          ZIP_PATH="$RUNNER_TEMP/aigostar.zip"
          cd custom_components/aigostar
          zip -r "$ZIP_PATH" . -x "__pycache__/*" -x "*.pyc"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          unzip -l "$ZIP_PATH"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.build.outputs.zip_path }}
